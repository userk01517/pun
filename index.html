<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Karuna!</title>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#fff0f6; --bg2:#ffd3e4; --bg3:#f8b2cc;
  --ink:#8c3a60; --soft:#c0668f; --moon1:#fffaf0; --moon2:#ffe1ea;
  --petal1:#ffffff; --petal2:#ffc4da; --stem:#8cc9a4; --glow:rgba(255,255,255,.7);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg1:#5a2a4a; --bg2:#7a3a62; --bg3:#a1507f;
    --ink:#ffe6f0; --soft:#ffc2da; --moon1:#fff6e6; --moon2:#ffd9e6;
    --stem:#6fae88; --glow:rgba(255,200,225,.35);
  }
}
:root[data-theme="dark"]{
  --bg1:#5a2a4a; --bg2:#7a3a62; --bg3:#a1507f;
  --ink:#ffe6f0; --soft:#ffc2da; --moon1:#fff6e6; --moon2:#ffd9e6;
  --stem:#6fae88; --glow:rgba(255,200,225,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  height:100%;margin:0;overflow:hidden;position:relative;
  font-family:"Quicksand",system-ui,sans-serif;color:var(--ink);
  background:linear-gradient(170deg,var(--bg1) 0%,var(--bg2) 55%,var(--bg3) 100%);
  user-select:none;-webkit-user-select:none;touch-action:manipulation;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg1);z-index:10}
#sky,#fx{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.star{position:absolute;border-radius:50%;background:#fff;opacity:.8;animation:twinkle var(--d) ease-in-out infinite;box-shadow:0 0 6px var(--glow)}
@keyframes twinkle{0%,100%{opacity:.15;transform:scale(.6)}50%{opacity:1;transform:scale(1.2)}}
.petal{position:absolute;top:-30px;width:14px;height:20px;border-radius:70% 0 70% 0;background:linear-gradient(135deg,#fff,#ffc4da);opacity:.85;animation:fall var(--t) linear infinite;animation-delay:var(--dl)}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(540deg)}}

main{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 20px 14vh}

.moon{position:relative;width:clamp(96px,26vw,140px);aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle at 28% 34%,rgba(200,150,170,.32) 0 7%,transparent 8%),radial-gradient(circle at 70% 24%,rgba(200,150,170,.26) 0 5%,transparent 6%),radial-gradient(circle at 74% 70%,rgba(200,150,170,.3) 0 9%,transparent 10%),radial-gradient(circle at 35% 30%,var(--moon1),var(--moon2));
  box-shadow:inset -12px -14px 26px rgba(190,110,145,.4),inset 6px 6px 14px rgba(255,255,255,.7);
  filter:drop-shadow(0 0 22px var(--glow));
  animation:bob 5s ease-in-out infinite;cursor:pointer}
@keyframes bob{50%{transform:translateY(-10px) rotate(-3deg)}}
.moon i{position:absolute;top:46%;width:16%;height:8%;border-bottom:3px solid var(--ink);border-radius:0 0 50% 50%}
.moon i:nth-child(1){left:24%}.moon i:nth-child(2){right:24%}
.moon b{position:absolute;top:58%;width:15%;aspect-ratio:1;border-radius:50%;background:#ff9fc0;opacity:.6}
.moon b:nth-child(3){left:12%}.moon b:nth-child(4){right:12%}
.moon u{position:absolute;top:64%;left:44%;width:12%;height:6%;border-bottom:3px solid var(--ink);border-radius:0 0 50% 50%}
.zzz{position:absolute;right:-34px;top:-8px;font-weight:700;color:var(--soft)}
.zzz span{position:absolute;opacity:0;animation:z 3s ease-in infinite;font-size:18px}
.zzz span:nth-child(2){animation-delay:1s;font-size:24px}
.zzz span:nth-child(3){animation-delay:2s;font-size:30px}
@keyframes z{0%{opacity:0;transform:translate(0,12px)}30%{opacity:1}100%{opacity:0;transform:translate(14px,-34px)}}

h1{margin:26px 0 0;font-family:"Pacifico",cursive;font-weight:400;line-height:1.1}
h1 .g{display:block;font-size:clamp(28px,7vw,44px);color:var(--soft)}
h1 .k{display:block;font-size:clamp(54px,17vw,110px);color:var(--ink);text-shadow:0 4px 0 var(--glow),0 8px 24px var(--glow)}
.letter{display:inline-block;opacity:0;transform:translateY(24px) scale(.6);animation:letter .7s cubic-bezier(.3,1.6,.5,1) forwards}
@keyframes letter{to{opacity:1;transform:none}}
#msg{margin:18px 0 0;min-height:1.6em;font-size:clamp(16px,4.4vw,20px);font-weight:700;color:var(--soft);transition:opacity .3s}
button{
  margin-top:22px;font:700 clamp(15px,4vw,18px) "Quicksand",system-ui,sans-serif;color:#fff;
  background:linear-gradient(180deg,#ff9cc2,#ec6fa0);border:0;border-radius:999px;
  padding:14px 28px;cursor:pointer;box-shadow:0 6px 0 #c8507f,0 12px 24px rgba(200,80,127,.35);
  transition:transform .12s,box-shadow .12s;
}
button:active{transform:translateY(5px);box-shadow:0 1px 0 #c8507f,0 4px 10px rgba(200,80,127,.35)}
button:focus-visible,.moon:focus-visible{outline:3px solid var(--ink);outline-offset:4px}

#garden{position:absolute;left:0;right:0;bottom:0;height:34vh;z-index:1;pointer-events:none}
.sprout{position:absolute;bottom:0;width:0;left:var(--x)}
.sprout .stem{position:absolute;bottom:0;left:-2px;width:4px;height:var(--h);border-radius:4px;background:linear-gradient(to top,#4f9166,var(--stem));transform-origin:bottom;transform:scaleY(0);animation:grow 1.4s cubic-bezier(.3,1,.4,1) forwards;animation-delay:var(--dl)}
.sprout .stem::after,.sprout .stem::before{content:"";position:absolute;top:58%;width:34px;height:13px;background:linear-gradient(100deg,#4f9166,#9ad1a8);box-shadow:inset 0 -2px 3px rgba(0,60,30,.25)}
.sprout .stem::after{left:3px;border-radius:0 100% 0 100%;transform:rotate(-22deg);transform-origin:left}
.sprout .stem::before{right:3px;top:40%;border-radius:100% 0 100% 0;transform:rotate(22deg);transform-origin:right}
.sprout .flower{filter:drop-shadow(0 4px 5px rgba(180,60,110,.3));position:absolute;left:calc(var(--s) / -2);bottom:var(--h);width:var(--s);height:var(--s);margin-bottom:calc(var(--s) / -2);transform:scale(0) rotate(-40deg);animation:bloom .9s cubic-bezier(.3,1.7,.5,1) forwards,sway 4s ease-in-out infinite;animation-delay:calc(var(--dl) + 1.2s),calc(var(--dl) + 2.2s)}
@keyframes grow{to{transform:scaleY(1)}}
@keyframes bloom{to{transform:scale(1) rotate(0)}}
@keyframes sway{50%{transform:scale(1) rotate(7deg)}}
.hill{position:absolute;left:-10%;right:-10%;bottom:-40px;height:90px;border-radius:50% 50% 0 0;background:linear-gradient(#ffc4da,#f59bbd);opacity:.8}

.pop{position:absolute;width:var(--s);height:var(--s);margin:calc(var(--s) / -2) 0 0 calc(var(--s) / -2);animation:pop 2.6s ease-out forwards;filter:drop-shadow(0 6px 8px rgba(200,80,127,.3))}
@keyframes pop{
  0%{transform:scale(0) rotate(-60deg);opacity:0}
  18%{transform:scale(1.25) rotate(8deg);opacity:1}
  30%{transform:scale(1) rotate(0)}
  75%{opacity:1}
  100%{transform:translateY(-90px) scale(.9) rotate(12deg);opacity:0}
}
.spark{position:absolute;font-size:18px;color:#ff7fae;animation:spark 1.1s ease-out forwards}
@keyframes spark{from{transform:translate(0,0) scale(.4);opacity:1}to{transform:translate(var(--x),var(--y)) scale(1.1);opacity:0}}

@media (max-height:560px){.moon{display:none}main{padding-bottom:6vh}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;animation-delay:0s!important}
  .petal{display:none}
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="pg" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#cfe08a"/><stop offset=".14" stop-color="#f27aa8"/><stop offset=".55" stop-color="#ffb7d2"/><stop offset="1" stop-color="#fff0f6"/>
    </linearGradient>
    <symbol id="lily" viewBox="0 0 100 100">
      <defs>
        <g id="pet">
          <path d="M50 52C32 43 27 18 45 4C48 1 52 1 55 4C73 18 68 43 50 52Z" fill="url(#pg)" stroke="#f3a0c0" stroke-width=".7"/>
          <path d="M50 52C58 42 68 24 55 4C73 18 68 43 50 52Z" fill="#c8407a" opacity=".16"/>
          <path d="M50 50C46 38 45 22 48 8" stroke="#fff" stroke-width="1.6" stroke-linecap="round" fill="none" opacity=".55"/>
          <g fill="#b83b74" opacity=".55"><circle cx="45" cy="38" r=".9"/><circle cx="53" cy="35" r=".8"/><circle cx="49" cy="31" r=".9"/><circle cx="56" cy="28" r=".7"/><circle cx="44" cy="27" r=".8"/><circle cx="51" cy="23" r=".7"/><circle cx="47" cy="43" r=".8"/></g>
        </g>
      </defs>
      <use href="#pet" transform="translate(50 50) rotate(0) scale(.93) translate(-50 -50)"/>
      <use href="#pet" transform="translate(50 50) rotate(120) scale(.93) translate(-50 -50)"/>
      <use href="#pet" transform="translate(50 50) rotate(240) scale(.93) translate(-50 -50)"/>
      <use href="#pet" transform="rotate(60 50 50)"/>
      <use href="#pet" transform="rotate(180 50 50)"/>
      <use href="#pet" transform="rotate(300 50 50)"/>
      <circle cx="50" cy="51" r="4.5" fill="#d6e48a"/>
      <g fill="none" stroke="#efe9b4" stroke-width="1.3" stroke-linecap="round">
        <path d="M50 52Q47 40 40 33"/><path d="M50 52Q50 38 50 28"/><path d="M50 52Q53 40 60 33"/><path d="M50 52Q44 46 35 46"/><path d="M50 52Q56 46 65 46"/>
      </g>
      <g fill="#a8561f">
        <ellipse cx="40" cy="33" rx="3.2" ry="1.5" transform="rotate(-50 40 33)"/><ellipse cx="50" cy="28" rx="1.5" ry="3.2"/><ellipse cx="60" cy="33" rx="3.2" ry="1.5" transform="rotate(50 60 33)"/>
        <ellipse cx="35" cy="46" rx="3.2" ry="1.5" transform="rotate(-10 35 46)"/><ellipse cx="65" cy="46" rx="3.2" ry="1.5" transform="rotate(10 65 46)"/>
      </g>
      <path d="M50 52Q51 44 52 36" stroke="#9ccf8f" stroke-width="1.8" stroke-linecap="round" fill="none"/><circle cx="52" cy="35" r="2" fill="#e7a0b8"/>
    </symbol>
  </defs>
</svg>

<div id="sky"></div>
<div id="fx"></div>

<div id="garden" aria-hidden="true"><div class="hill"></div></div>

<main>
  <div class="moon" id="moon" role="button" tabindex="0" aria-label="Sleepy moon, tap for a lily">
    <i></i><i></i><b></b><b></b><u></u>
    <div class="zzz"><span>z</span><span>z</span><span>Z</span></div>
  </div>
  <h1 aria-label="Goodnight Karuna"><span class="g" id="g"></span><span class="k" id="k"></span></h1>
  <p id="msg">Sweet dreams, little star</p>
  <button id="btn" type="button">Tap for a lily</button>
</main>

<script>
(function(){
  var fx=document.getElementById('fx'), sky=document.getElementById('sky');
  var garden=document.getElementById('garden');
  function r(a,b){return Math.random()*(b-a)+a}

  // stars
  for(var i=0;i<46;i++){
    var s=document.createElement('div'), z=r(2,5);
    s.className='star';
    s.style.cssText='left:'+r(0,100)+'%;top:'+r(0,70)+'%;width:'+z+'px;height:'+z+'px;--d:'+r(2,5)+'s;animation-delay:'+r(0,4)+'s';
    sky.appendChild(s);
  }
  // falling petals
  for(var j=0;j<14;j++){
    var p=document.createElement('div');
    p.className='petal';
    p.style.cssText='left:'+r(0,100)+'%;--t:'+r(9,16)+'s;--dl:-'+r(0,14)+'s;--dx:'+r(-60,60)+'px;transform:scale('+r(.6,1.1)+')';
    sky.appendChild(p);
  }

  // animated title letters
  function spell(el,text,start){
    for(var i=0;i<text.length;i++){
      var c=document.createElement('span');
      c.className='letter';
      c.textContent=text[i]===' '?'\u00a0':text[i];
      c.style.animationDelay=(start+i*0.09)+'s';
      el.appendChild(c);
    }
  }
  spell(document.getElementById('g'),'Goodnight',0.2);
  spell(document.getElementById('k'),'Karuna',1.1);

  // growing garden
  var xs=[8,27,47,67,88], hs=[12,20,15,22,13], sz=[58,72,64,76,56];
  xs.forEach(function(x,i){
    var d=document.createElement('div');
    d.className='sprout';
    d.style.cssText='--x:'+x+'%;--h:'+hs[i]+'vh;--s:'+sz[i]+'px;--dl:'+(0.4+i*0.25)+'s';
    d.innerHTML='<div class="stem"></div><div class="flower"><svg viewBox="0 0 100 100" width="100%" height="100%"><use href="#lily"/></svg></div>';
    garden.appendChild(d);
  });

  // pop a lily
  function pop(x,y,size){
    var d=document.createElement('div');
    d.className='pop';
    d.style.cssText='left:'+x+'px;top:'+y+'px;--s:'+size+'px';
    d.innerHTML='<svg viewBox="0 0 100 100" width="100%" height="100%"><use href="#lily"/></svg>';
    fx.appendChild(d);
    setTimeout(function(){d.remove()},2700);
    var marks=['\u2665','\u2726','\u273f'];
    for(var k=0;k<6;k++){
      var h=document.createElement('span');
      h.className='spark';
      h.textContent=marks[k%3];
      var a=Math.PI*2*k/6+r(-.3,.3), dist=r(50,90);
      h.style.cssText='left:'+x+'px;top:'+y+'px;--x:'+Math.cos(a)*dist+'px;--y:'+Math.sin(a)*dist+'px';
      fx.appendChild(h);
      setTimeout((function(n){return function(){n.remove()}})(h),1200);
    }
  }

  var msgs=['Sweet dreams, little star','Rest well, you did great today','Moonlight is hugging you','Sleep tight, Karuna','See you in the morning sun','Dream of soft, pink clouds'];
  var mi=0, msg=document.getElementById('msg');
  function next(){
    mi=(mi+1)%msgs.length;
    msg.style.opacity=0;
    setTimeout(function(){msg.textContent=msgs[mi];msg.style.opacity=1},250);
  }

  // tap anywhere
  document.addEventListener('pointerdown',function(e){
    if(e.target.closest('#btn')||e.target.closest('#moon'))return;
    pop(e.clientX,e.clientY,r(54,90));
  });

  function burst(){
    var w=window.innerWidth,h=window.innerHeight;
    for(var i=0;i<6;i++){
      (function(i){
        setTimeout(function(){pop(r(w*.12,w*.88),r(h*.15,h*.6),r(50,90))},i*140);
      })(i);
    }
    next();
  }
  document.getElementById('btn').addEventListener('click',burst);
  var moon=document.getElementById('moon');
  moon.addEventListener('click',burst);
  moon.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();burst()}});

  // welcome pops after the title appears
  setTimeout(function(){
    var w=window.innerWidth,h=window.innerHeight;
    pop(w*.2,h*.25,70);setTimeout(function(){pop(w*.8,h*.3,64)},300);
  },2000);
})();
</script>
</body>
</html>
